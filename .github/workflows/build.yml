name: Release Prebuilt Binaries

on:
  push:
    paths:
      - state/version.txt
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      distro:
        description: 'Choose distribution'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ubuntu-20.04
          - ubuntu-22.04
          - ubuntu-24.04
          - debian-11
          - debian-12
      arch:
        description: 'Choose architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - amd64
          - arm64

jobs:

  setup:
    name: Setup Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Generate Matrix JSON
      id: set-matrix
      run: |
        SELECTED_DISTRO="${{ github.event.inputs.distro || 'all' }}"
        SELECTED_ARCH="${{ github.event.inputs.arch || 'all' }}"

        DISTROS=("ubuntu-20.04" "ubuntu-22.04" "ubuntu-24.04" "debian-11" "debian-12")
        ARCHS=("amd64" "arm64")

        if [ "$SELECTED_DISTRO" != "all" ]; then
          DISTROS=("$SELECTED_DISTRO")
        fi
        if [ "$SELECTED_ARCH" != "all" ]; then
          ARCHS=("$SELECTED_ARCH")
        fi

        JSON_INCLUDE="[]"
        for distro in "${DISTROS[@]}"; do
          case "$distro" in
            ubuntu-20.04) image="ubuntu:20.04" ;;
            ubuntu-22.04) image="ubuntu:22.04" ;;
            ubuntu-24.04) image="ubuntu:24.04" ;;
            debian-11)    image="debian:11" ;;
            debian-12)    image="debian:12" ;;
            *) image="ubuntu:22.04" ;;
          esac

          for arch in "${ARCHS[@]}"; do
            JSON_INCLUDE=$(echo "$JSON_INCLUDE" | jq -c ". + [{\"os\": \"$distro\", \"image\": \"$image\", \"arch\": \"$arch\"}]")
          done
        done

        MATRIX_JSON=$(jq -c -n --argjson include "$JSON_INCLUDE" '{include: $include}')
        echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build binary inside Docker container
      run: |
        cat << 'EOF' > build_internal.sh
        #!/bin/bash
        set -e
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y gcc g++ git wget tar ca-certificates

        git config --global --add safe.directory /workspace

        if [ "$BUILD_ARCH" = "arm64" ]; then
          DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        fi

        wget -q https://go.dev/dl/go1.25.0.linux-amd64.tar.gz
        tar -C /usr/local -xzf go1.25.0.linux-amd64.tar.gz
        export PATH=$PATH:/usr/local/go/bin

        if [ "$BUILD_ARCH" = "amd64" ]; then
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildvcs=false -ldflags '-s -w' -o watgbridge_${BUILD_OS}_amd64 .
          chmod 755 watgbridge_${BUILD_OS}_amd64
        else
          CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ GOOS=linux GOARCH=arm64 go build -buildvcs=false -ldflags '-s -w' -o watgbridge_${BUILD_OS}_arm64 .
          chmod 755 watgbridge_${BUILD_OS}_arm64
        fi
        EOF

        chmod +x build_internal.sh
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace -e BUILD_OS="${{ matrix.os }}" -e BUILD_ARCH="${{ matrix.arch }}" ${{ matrix.image }} ./build_internal.sh
        rm build_internal.sh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: watgbridge_${{ matrix.os }}_${{ matrix.arch }}
        path: ./watgbridge_${{ matrix.os }}_${{ matrix.arch }}

  release:
    name: Create Release
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get Project Version
      id: get_version
      run: |
        echo "version=$(cat state/version.txt | tr -d '\n')" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
        pattern: watgbridge_*
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./artifacts/watgbridge_*
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
